<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="Steeve Donald Compaore - FORGE Afrika. Ouagadougou to Tokat.">
  <title>Steeve Donald Compaoré — FORGE Afrika</title>
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A1628"/>
      <stop offset="62%"  stop-color="#0d1d33"/>
      <stop offset="100%" stop-color="#132845"/>
    </linearGradient>
    <radialGradient id="braise" cx="50%" cy="100%" r="62%">
      <stop offset="0%"   stop-color="#D4AF37" stop-opacity=".40"/>
      <stop offset="45%"  stop-color="#b8791f" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F3D67A"/>
      <stop offset="52%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8801f"/>
    </linearGradient>
    <linearGradient id="lustre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#fff" stop-opacity=".85"/>
      <stop offset="55%"  stop-color="#fff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="masqueNom">
      <text x="600" y="150" text-anchor="middle" font-size="68" font-weight="800" fill="#fff"
            font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" letter-spacing="1.5">STEEVE DONALD COMPAORÉ</text>
    </mask>
    <style>
      @keyframes monte   { 0%{transform:translateY(0);opacity:0} 12%{opacity:1} 100%{transform:translateY(-190px);opacity:0} }
      @keyframes respire { 0%,100%{opacity:.45} 50%{opacity:1} }
      @keyframes balaie  { 0%{transform:translateX(-620px)} 55%,100%{transform:translateX(620px)} }
      @keyframes trace   { to{stroke-dashoffset:0} }
      @keyframes apparait{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
      .etincelle{animation:monte 3.4s ease-out infinite}
      .lueur{animation:respire 3.6s ease-in-out infinite;transform-origin:center}
      .lustre{animation:balaie 4.6s ease-in-out infinite}
      .regle{stroke-dasharray:420;stroke-dashoffset:420;animation:trace 1.6s .5s ease-out forwards}
      .sous{opacity:0;animation:apparait .9s 1.1s ease-out forwards}
      .lieu{opacity:0;animation:apparait .9s 1.5s ease-out forwards}
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#ciel)"/>
  <rect width="1200" height="300" fill="url(#braise)" class="lueur"/>

  <g fill="#D4AF37">
    <circle class="etincelle" cx="248" cy="272" r="2.6" style="animation-delay:0s"   opacity="0"/>
    <circle class="etincelle" cx="352" cy="278" r="1.9" style="animation-delay:.7s"  opacity="0"/>
    <circle class="etincelle" cx="470" cy="274" r="3.1" style="animation-delay:1.5s" opacity="0"/>
    <circle class="etincelle" cx="596" cy="280" r="2.2" style="animation-delay:.35s" opacity="0" fill="#00BCD4"/>
    <circle class="etincelle" cx="712" cy="273" r="2.8" style="animation-delay:2.1s" opacity="0"/>
    <circle class="etincelle" cx="838" cy="279" r="2.0" style="animation-delay:1.1s" opacity="0" fill="#00BCD4"/>
    <circle class="etincelle" cx="946" cy="275" r="2.9" style="animation-delay:2.6s" opacity="0"/>
  </g>

  <text x="600" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#00BCD4"
        font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" letter-spacing="7.5">FORGE AFRIKA</text>

  <text x="600" y="150" text-anchor="middle" font-size="68" font-weight="800" fill="url(#or)"
        font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" letter-spacing="1.5">STEEVE DONALD COMPAORÉ</text>
  <g mask="url(#masqueNom)">
    <rect class="lustre" x="0" y="90" width="230" height="80" fill="url(#lustre)"/>
  </g>

  <path class="regle" d="M390 178h420" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <text class="sous" x="600" y="214" text-anchor="middle" font-size="21" font-weight="600" fill="#e8eef7"
        font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">I build the boring software African industry actually needs</text>
  <text class="lieu" x="600" y="250" text-anchor="middle" font-size="15" font-weight="500" fill="#8fa6c4"
        font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" letter-spacing="2.5">OUAGADOUGOU  →  TOKAT   ·   COMPUTER SCIENCE   ·   BUILDING SINCE 2024</text>
</svg>
